<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="De Michel">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<title>De Michel</title>
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-startup-image" href="assets/startup-390x844.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="assets/startup-393x852.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="assets/startup-430x932.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700;900&display=swap" rel="stylesheet">
<style>html,body{background:#000;margin:0}</style>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="splash">
  <img id="sp-img" src="assets/splash.jpg" alt="" onerror="this.parentNode.classList.add('nophoto');this.remove()">
  <div class="sp-title"><small>De</small><b>Michel</b></div>
  <div class="sp-bar"><i></i></div>
</div>

<header id="bar">
  <div class="ctitle" id="ctitle"></div>
  <div class="sync" id="sync"><i></i><span>LIVE</span></div>
  <button class="shr" data-a="share" aria-label="Delen"></button>
</header>

<main id="scroll"><div id="view"></div></main>

<nav id="tabs">
  <button class="tab on" data-tab="crew"></button>
  <button class="tab" data-tab="top"></button>
  <span></span>
  <button class="tab" data-tab="log"></button>
  <button class="tab" data-tab="settings"></button>
  <button class="plus" data-a="plus" aria-label="Bijpakken"></button>
</nav>

<section id="install"></section>

<section id="start">
  <div class="hero"><small>De</small><b>Michel</b></div>
  <p class="tag">Houd per feestje bij wie wat nam en wanneer er bijgepakt mag worden.</p>
  <button class="big xl" data-a="newparty">Nieuw feestje</button>
  <p class="hint">Vraag De Michel om de link of QR. Of open de link of scan de QR van De Michel opnieuw.</p>
  <button class="big xl outline" data-a="pastelink" style="margin-top:14px;height:84px;font-size:34px">Plak link</button>
  <button id="myid" class="myid"></button>
</section>

<div id="stack"></div>
<div class="bd" id="bd"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<div class="alarm" id="alarm">
  <div>
    <h1>Inkakken<br>is<br>bijpakken!</h1>
    <div class="who" id="a-who"></div>
    <div class="why" id="a-why"></div>
    <div class="why pn" id="a-party"></div>
  </div>
  <div class="btns">
    <button data-a="a-took">Pakt bij</button>
    <button class="sec" data-a="a-snooze">Over 10 min nog eens</button>
    <button class="sec" data-a="a-ok">Nee, klaar</button>
  </div>
</div>

<div id="fatal"><h2>Geen verbinding</h2><p>De Michel kan de server niet bereiken.</p><button class="big" onclick="location.reload()">Opnieuw proberen</button></div>

<script src="vendor/qrcode.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
